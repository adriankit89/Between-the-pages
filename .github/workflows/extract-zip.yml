
name: Extract project ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -o "Between_the_Pages_Launch_Ready 2.zip" -d extracted
          cp -a extracted/. .
          rm -rf extracted
          rm "Between_the_Pages_Launch_Ready 2.zip"

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract Between the Pages project"
          git push
